            if (isSequence) score -= 1;
            const weakPasswords = ['password','12345678','qwerty','abc123','111111','admin','letmein','monkey','dragon','master'];
            if (weakPasswords.includes(lowerPwd)) score = 1;
            score = Math.max(0, Math.min(4, Math.round(score)));
            return score;
        },
        isStrongMasterPassword: function(password) {
            if (password.length < CONFIG.MASTER_MIN_LEN) return false;
            return /[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
        },
        strengthText: function(level) {
            return ['❌ 太弱','⚠️ 弱','📈 中等','✅ 强','💪 非常强'][level] || '未知';
        },
        strengthColor: function(level) {
            return ['#dc2626','#f59e0b','#f59e0b','#059669','#059669'][level] || '#dc2626';
        }
    };

    // ===================== 加密模块 =====================
    const CryptoModule = {
        deriveKey: async function(password, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name:'PBKDF2', salt: salt, iterations: CONFIG.PBKDF2_ITERATIONS, hash:'SHA-256' },
                keyMaterial,
                { name:'AES-GCM', length: 256 },
                false,
                ['encrypt','decrypt']
            );
        },
        computeStringChecksum: async function(text) {
            const encoder = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', encoder.encode(text));
            return Array.from(new Uint8Array(hash)).map(byte => byte.toString(16).padStart(2,'0')).join('');
        },
        encrypt: async function(key, data) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const plaintext = JSON.stringify(data);
            const checksum = await this.computeStringChecksum(plaintext);
            const encoder = new TextEncoder();
            const ciphertext = await crypto.subtle.encrypt(
                { name:'AES-GCM', iv: iv, additionalData: encoder.encode(checksum) },
                key,
                encoder.encode(plaintext)
            );
            return {
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(ciphertext)),
                checksum: checksum
            };
        },
        decrypt: async function(key, encryptedObject) {
            const iv = new Uint8Array(encryptedObject.iv);
            const ciphertext = new Uint8Array(encryptedObject.ciphertext);
            const checksum = encryptedObject.checksum;
            if (!checksum) throw new Error('缺少完整性校验值');
            const encoder = new TextEncoder();
            const decryptedBuffer = await crypto.subtle.decrypt(
                { name:'AES-GCM', iv: iv, additionalData: encoder.encode(checksum) },
                key,
                ciphertext
            );
            const plaintext = new TextDecoder().decode(decryptedBuffer);
            const computedChecksum = await this.computeStringChecksum(plaintext);
            if (computedChecksum !== checksum) {
                throw new Error('数据完整性校验失败，可能已损坏或被篡改');
            }
            return JSON.parse(plaintext);
        },
        createAuthVerifier: async function(key) {
            return this.encrypt(key, { test:'serene-vault-verified-v3' });
        },
        verifyAuth: async function(key, authData) {
            try {
                await this.decrypt(key, authData);
                return true;
            } catch(error) {
                return false;
            }
        }
    };

    // ===================== 安全锁定持久化 =====================
    let securityStateMemory = null;

    function loadSecurityState() {
        try {
            const raw = localStorage.getItem(CONFIG.SECURITY_STORAGE);
            if (raw) return JSON.parse(raw);
        } catch (e) {
            console.warn('安全状态读取失败，使用内存存储:', e);
        }
        if (securityStateMemory) return securityStateMemory;
        return { bruteFailCount: 0, lockoutUntil: 0 };
    }
    function saveSecurityState(securityData) {
        securityStateMemory = securityData;
        try {
            localStorage.setItem(CONFIG.SECURITY_STORAGE, JSON.stringify(securityData));
        } catch (error) {
            console.warn('安全状态保存失败，降级为内存存储:', error);
        }
    }
    function getSecurityState() {
        return loadSecurityState();
    }
    function updateSecurityState(updates) {
        const current = loadSecurityState();
        const merged = Object.assign({}, current, updates);
        saveSecurityState(merged);
    }

    // ===================== 保存操作串行化队列 =====================
    let saveOperationChain = Promise.resolve();

    function queueSaveOperation(operation) {
        const result = saveOperationChain.then(operation, operation);
        saveOperationChain = result.catch(function(error) {
            console.warn('保存队列中的操作失败:', error);
        });
        return result;
    }

    // ===================== 速率限制 =====================
    async function applyRateLimit(failCount) {
        if (failCount <= 0) return;
        const delay = CONFIG.BASE_DELAY_MS * Math.pow(2, Math.min(failCount - 1, 5));
        await new Promise(resolve => setTimeout(resolve, delay));
    }

    // ===================== 保存与解锁 =====================
    async function saveVault() {
        if (!State.masterKey) return;
        const vaultData = {
            passwords: State.passwords,
            customCategories: State.customCategories,
            version: 3,
            lastUpdated: Date.now()
        };
        const encrypted = await CryptoModule.encrypt(State.masterKey, vaultData);
        try {
            localStorage.setItem(CONFIG.STORAGE_VAULT, JSON.stringify(encrypted));
            localStorage.setItem(CONFIG.STORAGE_INIT, 'true');
        } catch (error) {
            throw new Error('数据保存失败：浏览器存储空间可能不足或不可用');
        }
        if (State.channel) {
            try {
                State.channel.postMessage({ type: 'vaultUpdated', timestamp: Date.now() });
            } catch (error) {
                console.warn('BroadcastChannel 消息发送失败:', error);
            }
        }
    }

    async function saveEncrypted() {
        return queueSaveOperation(async function() {
            await saveVault();
            if (State.activeCategoryModal && document.body.contains(State.activeCategoryModal)) {
                const container = State.activeCategoryModal.querySelector('#catListManage');
                if (container) renderCategoryList(container);
            }
        });
    }

    function cleanMigrationBackup() {
        try {
            localStorage.removeItem(CONFIG.MIGRATION_BACKUP_KEY);
        } catch(e) {
            console.warn('清理迁移备份失败:', e);
        }
    }

    async function verifyMasterPassword(password) {
        const security = getSecurityState();
        if (security.lockoutUntil && Date.now() < security.lockoutUntil) {
            const remaining = Math.ceil((security.lockoutUntil - Date.now()) / 1000);
            throw new Error(`账户已被临时锁定，请等待 ${remaining} 秒后重试`);
        }
        const saltArray = JSON.parse(localStorage.getItem(CONFIG.STORAGE_SALT));
        const authData = JSON.parse(localStorage.getItem(CONFIG.STORAGE_AUTH));
        if (!saltArray || !authData) throw new Error('未初始化');
        const key = await CryptoModule.deriveKey(password, new Uint8Array(saltArray));
        return await CryptoModule.verifyAuth(key, authData);
    }

    async function initializeNewVault(password) {
        if (!Util.isStrongMasterPassword(password)) throw new Error(`主密码需至少${CONFIG.MASTER_MIN_LEN}位，且包含大写、小写、数字、特殊符号四类字符`);
        try {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await CryptoModule.deriveKey(password, salt);
            const authData = await CryptoModule.createAuthVerifier(key);
            localStorage.setItem(CONFIG.STORAGE_SALT, JSON.stringify(Array.from(salt)));
            localStorage.setItem(CONFIG.STORAGE_AUTH, JSON.stringify(authData));
            localStorage.setItem(CONFIG.STORAGE_INIT, 'true');
            saveSecurityState({ bruteFailCount: 0, lockoutUntil: 0 });
            State.masterKey = key;
            State.passwords = [];
            State.customCategories = ['E-Mail','工作','社交','银行','购物','娱乐','其他'];
            State.rebuildIndex();
            await saveVault();
            addLog('初始化','创建新保险库');
        } catch (error) {
            try {
                localStorage.removeItem(CONFIG.STORAGE_SALT);
                localStorage.removeItem(CONFIG.STORAGE_AUTH);
                localStorage.removeItem(CONFIG.STORAGE_INIT);
                localStorage.removeItem(CONFIG.STORAGE_VAULT);
            } catch(e) {
                console.warn('初始化失败清理异常:', e);
            }
            State.masterKey = null;
            State.passwords = [];
            State.customCategories = [];
            State.passwordIdIndex.clear();
            State.visibleLoginPasswords.clear();
            State.visibleTransactionPasswords.clear();
            State.lastReauthenticationTime = 0;
            State.bruteFailCount = 0;
            State.verifyFailCount = 0;
            throw new Error('初始化失败：' + error.message);
        }
    }

    async function unlockVault(password) {
        const security = getSecurityState();
        if (security.lockoutUntil && Date.now() < security.lockoutUntil) {
            const remaining = Math.ceil((security.lockoutUntil - Date.now()) / 1000);
            throw new Error(`账户已被临时锁定，请等待 ${remaining} 秒后重试`);
        }
        const saltArray = JSON.parse(localStorage.getItem(CONFIG.STORAGE_SALT));
        const authData = JSON.parse(localStorage.getItem(CONFIG.STORAGE_AUTH));
        if (!saltArray || !authData) throw new Error('未初始化');
        const salt = new Uint8Array(saltArray);
        const key = await CryptoModule.deriveKey(password, salt);
        const isAuthValid = await CryptoModule.verifyAuth(key, authData);

        if (!isAuthValid) {
            let newFailCount = (security.bruteFailCount || 0) + 1;
            let lockoutUntil = security.lockoutUntil || 0;
            if (newFailCount >= CONFIG.MAX_FAIL_COUNT) {
                lockoutUntil = Date.now() + CONFIG.LOCK_DURATION_INCREMENT_MS * Math.pow(2, Math.min(newFailCount - CONFIG.MAX_FAIL_COUNT, 4));
            }
            updateSecurityState({ bruteFailCount: newFailCount, lockoutUntil: lockoutUntil });
            State.bruteFailCount = newFailCount;
            await applyRateLimit(newFailCount);
            throw new Error('主密码错误');
        }

        const vaultRaw = localStorage.getItem(CONFIG.STORAGE_VAULT);
        if (!vaultRaw) throw new Error('保险库数据缺失');
        let decrypted;
        try {
            decrypted = await CryptoModule.decrypt(key, JSON.parse(vaultRaw));
        } catch (error) {
            if (error.message.includes('完整性校验失败')) {
                throw new Error('保险库数据损坏或被篡改');
            }
            throw new Error('解密失败，可能主密码错误或数据损坏');
        }

        State.passwords = decrypted.passwords || [];
        State.customCategories = decrypted.customCategories || [];
        if (!State.customCategories.length) State.customCategories = ['E-Mail','工作','社交','银行','购物','娱乐','其他'];
        migrateOldData();
        State.rebuildIndex();

        State.masterKey = key;
        State.bruteFailCount = 0;
        State.lastReauthenticationTime = 0;
        updateSecurityState({ bruteFailCount: 0, lockoutUntil: 0 });

        cleanMigrationBackup();

        if (State.channel) {
            State.channel.close();
            State.channel = null;
        }
        if (typeof BroadcastChannel !== 'undefined') {
            try {
                State.channel = new BroadcastChannel('serene_vault_sync');
                State.channel.onmessage = async function(event) {
                    if (event.data && event.data.type === 'vaultUpdated') {
                        if (State.activeEditItemId && typeof State.activeEditModalCleanup === 'function') {
                            showToast('⚠️ 其他窗口已更新数据，当前编辑将被关闭', true, 3000);
                            State.activeEditModalCleanup();
                        }
                        if (State.addSectionVisible) {
                            const addSection = document.getElementById('addSection');
                            if (addSection && addSection.style.display !== 'none') {
                                const nameInput = document.getElementById('inpName');
                                const loginPwInput = document.getElementById('inpLoginPw');
                                const hasUnsaved = (nameInput && nameInput.value.trim()) || (loginPwInput && loginPwInput.value.trim());
                                if (hasUnsaved) {
                                    showToast('⚠️ 其他窗口已更新数据，未保存的添加内容将被丢弃', true, 3000);
                                    if (addSection) addSection.style.display = 'none';
                                    State.addSectionVisible = false;
                                    const chevron = document.getElementById('addToggleChevron');
                                    if (chevron) chevron.style.transform = 'rotate(0deg)';
                                    ['inpName','inpUsername','inpLoginPw','inpTranPw','inpEmail','inpPhone','inpCategory','inpNote'].forEach(function(id) {
                                        const el = document.getElementById(id);
                                        if (el) el.value = '';
                                    });
                                    resetPasswordVisibilityButtons();
                                    updateAllSelectColors();
                                }
                            }
                        }
                        try {
                            const vaultRawReload = localStorage.getItem(CONFIG.STORAGE_VAULT);
                            if (!vaultRawReload) return;
                            const decryptedReload = await CryptoModule.decrypt(State.masterKey, JSON.parse(vaultRawReload));
                            State.passwords = decryptedReload.passwords || [];
                            State.customCategories = decryptedReload.customCategories || [];
                            if (!State.customCategories.length) State.customCategories = ['E-Mail','工作','社交','银行','购物','娱乐','其他'];
                            migrateOldData();
                            State.rebuildIndex();
                            if (typeof renderListOnly === 'function') renderListOnly();
                            if (typeof refreshDatalist === 'function') refreshDatalist();
                            showToast('🔄 数据已从另一窗口同步');
                        } catch (error) {
                            console.warn('同步失败:', error);
                        }
                    } else if (event.data && event.data.type === 'masterPasswordChanged') {
                        showToast('⚠️ 主密码已在其他窗口修改，即将锁定', true, 3000);
                        lockAndLogout();
                    }
                };
            } catch (error) {
                console.warn('BroadcastChannel 创建失败，跨窗口同步不可用:', error);
                State.channel = null;
            }
        }

        addLog('登录','成功解锁');
        startIdleMonitor();
        return true;
    }

    function onVisibilityChange() {
        if (document.hidden) {
            if (State.visibilityLockTimer) clearTimeout(State.visibilityLockTimer);
            State.visibilityLockTimer = setTimeout(function() {
                if (document.hidden && State.masterKey) {
                    lockAndLogout();
                }
            }, CONFIG.VISIBILITY_LOCK_DELAY);
        } else {
            if (State.visibilityLockTimer) {
                clearTimeout(State.visibilityLockTimer);
                State.visibilityLockTimer = null;
            }
            State.lastActivity = Date.now();
        }
    }

    function startIdleMonitor() {
        if (State.idleTimer) clearInterval(State.idleTimer);
        State.idleTimer = setInterval(function() {
            if (State.masterKey && (Date.now() - State.lastActivity) >= CONFIG.IDLE_TIMEOUT) {
                lockAndLogout();
            }
        }, 30000);

        document.removeEventListener('visibilitychange', onVisibilityChange);
        document.addEventListener('visibilitychange', onVisibilityChange);
    }

    function lockAndLogout() {
        if (State.idleTimer) { clearInterval(State.idleTimer); State.idleTimer = null; }
        if (State.visibilityLockTimer) { clearTimeout(State.visibilityLockTimer); State.visibilityLockTimer = null; }
        if (State.channel) { State.channel.close(); State.channel = null; }

        try {
            if (typeof State.activeEditModalCleanup === 'function') {
                State.activeEditModalCleanup();
            }
        } catch(e) {
            console.warn('编辑模态框清理失败:', e);
        }

        document.querySelectorAll('.modal').forEach(function(modal) { modal.remove(); });
        document.body.classList.remove('modal-open');

        State.reset();
        showToast('⏰ 已自动锁定');
        showAuth();
    }

    // ===================== 分类管理 =====================
    function loadCategories() {
        return [...State.customCategories];
    }
    function saveCategories(categories) { State.customCategories = [...new Set(categories)]; }
    function addCategory(name) {
        const trimmed = name.trim();
        if (!trimmed) return false;
        const current = loadCategories();
        if (current.includes(trimmed)) return false;
        current.push(trimmed);
        current.sort(function(a,b){ return a.localeCompare(b); });
        saveCategories(current);
        return true;
    }
    function removeCategory(name) {
        const current = loadCategories();
        const filtered = current.filter(function(c){ return c !== name; });
        if (filtered.length !== current.length) { saveCategories(filtered); return true; }
        return false;
    }
    function batchAddCategories(newCategories, replaceExisting) {
        if (replaceExisting === undefined) replaceExisting = false;
        if (!newCategories.length) return false;
        if (replaceExisting) { saveCategories([...new Set(newCategories)]); return true; }
        const currentSet = new Set(loadCategories());
        const toAdd = [...new Set(newCategories.filter(function(c){ return c && c.trim() && !currentSet.has(c.trim()); }))].map(function(c){ return c.trim(); });
        if (!toAdd.length) return false;
        const updated = [...loadCategories(), ...toAdd];
        updated.sort(function(a,b){ return a.localeCompare(b); });
        saveCategories(updated);
        return true;
    }

    // ===================== 提示与剪贴板 =====================
    function showToast(message, isError, duration) {
        if (isError === undefined) isError = false;
        if (duration === undefined) duration = 2800;
        document.querySelectorAll('.toast').forEach(function(toast) { toast.remove(); });
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        if (isError) toast.style.background = '#dc2626';
        document.body.appendChild(toast);
        setTimeout(function(){ toast.remove(); }, duration);
        if (navigator.vibrate) navigator.vibrate(isError ? 80 : 30);
    }

    // ===================== 自定义确认对话框（带 allowHtml 支持） =====================
    function showConfirmDialog(options) {
        return new Promise(function(resolve) {
            const dialogTitle = options.title || '确认操作';
            const dialogMessage = options.message || '';
            const confirmButtonText = options.confirmText || '确认';
            const cancelButtonText = options.cancelText || '取消';
            const isDangerAction = options.isDanger || false;
            const requiredConfirmationText = options.requireConfirmationText || null;
            const allowHtml = options.allowHtml || false;
            const confirmButtonClass = isDangerAction ? 'btn-danger' : 'btn-primary';

            const modal = document.createElement('div');
            modal.className = 'modal';

            let confirmationInputHtml = '';
            if (requiredConfirmationText) {
                confirmationInputHtml = `
                    <p style="margin-top:12px;">请输入 <strong>${Util.escapeHtml(requiredConfirmationText)}</strong> 确认操作：</p>
                    <input type="text" id="confirmDialogInput" autocomplete="off" autocapitalize="none" style="margin-top:8px;">`;
            }

            const safeMessage = allowHtml ? dialogMessage : Util.escapeHtml(dialogMessage);

            modal.innerHTML = `
                <div class="modal-card">
                    <h3>${Util.escapeHtml(dialogTitle)}</h3>
                    <p style="color:var(--text-secondary);margin-bottom:12px;line-height:1.7;">${safeMessage}</p>
                    ${confirmationInputHtml}
                    <div class="button-group">
                        <button id="confirmDialogCancel" class="btn btn-outline">${Util.escapeHtml(cancelButtonText)}</button>
                        <button id="confirmDialogConfirm" class="btn ${confirmButtonClass}">${Util.escapeHtml(confirmButtonText)}</button>
                    </div>
                </div>`;

            document.body.appendChild(modal);
            document.body.classList.add('modal-open');

            const previousFocus = document.activeElement;
            const confirmationInput = modal.querySelector('#confirmDialogInput');
            if (confirmationInput) confirmationInput.focus();

            const cleanupDialog = function(result) {
                if (confirmationInput) confirmationInput.value = '';
                modal.remove();
                document.body.classList.remove('modal-open');
                if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
                resolve(result);
            };

            modal.querySelector('#confirmDialogCancel').onclick = function() { cleanupDialog(false); };

    // ===================== 密码生成器 =====================
    function generateSecurePassword(length) {
        if (!length) length = CONFIG.GENERATED_PASSWORD_LENGTH;
        if (length < CONFIG.LOGIN_PW_MIN) length = CONFIG.LOGIN_PW_MIN;
        if (length > CONFIG.LOGIN_PW_MAX) length = CONFIG.LOGIN_PW_MAX;

        const lowerCaseCharacters = 'abcdefghijklmnopqrstuvwxyz';
        const upperCaseCharacters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const numberCharacters = '0123456789';
        const symbolCharacters = '!@#$%^&*()-_=+[]{};:,.<>?';
        const allCharacters = lowerCaseCharacters + upperCaseCharacters + numberCharacters + symbolCharacters;

        const passwordCharacters = [];
        const randomBytes = new Uint8Array(length);
        crypto.getRandomValues(randomBytes);

        passwordCharacters.push(lowerCaseCharacters[randomBytes[0] % lowerCaseCharacters.length]);
        passwordCharacters.push(upperCaseCharacters[randomBytes[1] % upperCaseCharacters.length]);
        passwordCharacters.push(numberCharacters[randomBytes[2] % numberCharacters.length]);
        passwordCharacters.push(symbolCharacters[randomBytes[3] % symbolCharacters.length]);

        for (let index = 4; index < length; index++) {
            passwordCharacters.push(allCharacters[randomBytes[index] % allCharacters.length]);
        }

        const shuffleRandomBytes = new Uint8Array(passwordCharacters.length);
        crypto.getRandomValues(shuffleRandomBytes);
        for (let index = passwordCharacters.length - 1; index > 0; index--) {
            const randomIndex = shuffleRandomBytes[index] % (index + 1);
            const temporaryCharacter = passwordCharacters[index];
            passwordCharacters[index] = passwordCharacters[randomIndex];
            passwordCharacters[randomIndex] = temporaryCharacter;
        }

        return passwordCharacters.join('');
    }

    function generateTransactionPassword() {
        const randomBytes = new Uint8Array(CONFIG.TRAN_PW_LEN);
        crypto.getRandomValues(randomBytes);
        return Array.from(randomBytes).map(function(byte) { return byte % 10; }).join('');
    }

    // ===================== 重新认证 =====================
    async function promptReauthentication(actionDescription, returnPassword, forceReauth) {
        if (returnPassword === undefined) returnPassword = false;
        if (forceReauth === undefined) forceReauth = false;
        if (!State.masterKey) throw new Error('未解锁');
        if (!forceReauth && !returnPassword && State.lastReauthenticationTime && (Date.now() - State.lastReauthenticationTime) < CONFIG.REAUTH_VALIDITY_MS) {
            return true;
        }
        return new Promise(function(resolve) {
            const modal = document.createElement('div'); modal.className='modal';
            modal.innerHTML = `<div class="modal-card"><h3><svg class="icon" style="width:1.4rem;height:1.4rem;"><use href="#icon-lock"/></svg> 验证身份</h3><p style="color:var(--text-secondary);margin-bottom:12px;">执行「${Util.escapeHtml(actionDescription)}」需要验证主密码</p><input type="password" id="verifyPw" placeholder="请输入当前主密码" autocomplete="off" autocapitalize="none" autofocus><div class="button-group"><button id="cancelVerify" class="btn btn-outline">取消</button><button id="confirmVerify" class="btn btn-primary">确认</button></div></div>`;
            document.body.appendChild(modal); document.body.classList.add('modal-open');
            const previousFocus = document.activeElement;
            const input = modal.querySelector('#verifyPw');
            const confirmButton = modal.querySelector('#confirmVerify');
            const cleanup = function(value) {
                if (input) input.value = '';
                modal.remove();
                document.body.classList.remove('modal-open');
                if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
                resolve(value);
            };
            confirmButton.onclick = async function() {
                const password = input.value;
                if (!password) { showToast('请输入主密码', true); return; }
                try {
                    const isValid = await verifyMasterPassword(password);
                    if (!isValid) {
                        State.verifyFailCount = (State.verifyFailCount || 0) + 1;
                        await applyRateLimit(State.verifyFailCount);
                        showToast('主密码错误', true);
                        input.value = ''; input.focus();
                        return;
                    }
                    State.verifyFailCount = 0;
                    State.lastReauthenticationTime = Date.now();
                    const result = returnPassword ? password : true;
                    cleanup(result);
                } catch(error) {
                    showToast(error.message, true);
                    input.value = ''; input.focus();
                }
            };
            modal.querySelector('#cancelVerify').onclick = function() { cleanup(returnPassword ? null : false); };
            input.addEventListener('keypress', function(e) { if (e.key==='Enter') confirmButton.click(); });
        });
    }
    async function requireReauthentication(actionDesc, force) {
        if (force === undefined) force = false;
        if (!await promptReauthentication(actionDesc, false, force)) throw new Error('验证取消');
        return true;
    }

    // ===================== CSV 解析器 =====================
    function parseCSV(csvText) {
        const rows = [];
        let currentRow = [];
        let currentField = '';
        let inQuotes = false;
        let i = 0;
        while (i < csvText.length) {
            const char = csvText[i];
            if (char === '"') {
                if (inQuotes && i + 1 < csvText.length && csvText[i + 1] === '"') {
                    currentField += '"';
                    i += 2;
                    continue;
                } else {
                    inQuotes = !inQuotes;
                    i++;
                    continue;
                }
            }
            if (char === ',' && !inQuotes) {
                currentRow.push(currentField);
                currentField = '';
                i++;
                continue;
            }
            if (!inQuotes && (char === '\n' || char === '\r')) {
                if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                    i++;
                }
                currentRow.push(currentField);
                if (currentRow.length > 1 || currentRow[0] !== '') {
                    rows.push(currentRow);
                }
                currentRow = [];
                currentField = '';
                i++;
                continue;
            }
            currentField += char;
            i++;
        }
        if (currentField !== '' || currentRow.length > 0) {
            currentRow.push(currentField);
            if (currentRow.length > 1 || currentRow[0] !== '') {
                rows.push(currentRow);
            }
        }
        return rows;
    }

    // ===================== 分类列表渲染（带防抖编辑） =====================
    function renderCategoryList(container) {
        const categories = loadCategories();
        const countMap = new Map();
        State.passwords.forEach(function(item) {
            if (item.category) countMap.set(item.category, (countMap.get(item.category) || 0) + 1);
        });
        container.innerHTML = '';
        if (!categories.length) {
            container.innerHTML = '<div class="cat-empty"><div style="font-size:2rem;margin-bottom:8px;">📁</div><p>暂无自定义分类</p><p style="font-size:0.75rem;color:var(--text-secondary);">添加后将在此显示</p></div>';
            const countElement = State.activeCategoryModal ? State.activeCategoryModal.querySelector('#catCount') : null;
            if (countElement) countElement.innerText = '0';
            return;
        }
        categories.forEach(function(category) {
            const count = countMap.get(category) || 0;
            const tag = document.createElement('div');
            tag.className = 'cat-tag';
            tag.innerHTML = `
                <span class="cat-name-text">${Util.escapeHtml(category)}</span>
                <span class="cat-count">${count}</span>
                <span class="cat-actions">
                    <button data-cat-delete="${Util.escapeAttr(category)}" title="删除分类" aria-label="删除分类 ${Util.escapeAttr(category)}">
                        <svg class="icon"><use href="#icon-trash"/></svg>
                    </button>
                </span>`;
            container.appendChild(tag);

            tag.addEventListener('dblclick', function(event) {
                if (event.target.closest('button')) return;
                const oldCategory = category;
                promptRenameCategory(oldCategory).then(async function(newCategory) {
                    if (!newCategory || newCategory === oldCategory) return;
                    const oldPasswords = State.passwords.map(function(p) { return {...p}; });
                    const oldCategories = [...State.customCategories];
                    const exists = State.customCategories.some(function(c) { return c === newCategory; });
                    if (exists) {
                        showToast('分类名称已存在', true);
                        return;
                    }
                    const index = State.customCategories.indexOf(oldCategory);
                    if (index !== -1) {
                        State.customCategories.splice(index, 1, newCategory);
                        State.customCategories.sort(function(a, b) { return a.localeCompare(b); });
                    }
                    State.passwords.forEach(function(item) {
                        if (item.category === oldCategory) {
                            item.category = newCategory;
                        }
                    });
                    State.rebuildIndex();
                    try {
                        await saveEncrypted();
                    } catch (error) {
                        State.passwords = oldPasswords;
                        State.customCategories = oldCategories;
                        State.rebuildIndex();
                        renderCategoryList(container);
                        renderListOnly();
                        refreshDatalist();
                        showToast('保存失败：' + error.message, true, 5000);
                        return;
                    }
                    renderListOnly();
                    refreshDatalist();
                    renderCategoryList(container);
                    showToast(`分类已重命名为「${newCategory}」`);
                });
            });
        });

        // 绑定删除按钮事件
        container.querySelectorAll('button[data-cat-delete]').forEach(function(button) {
            button.addEventListener('click', async function(event) {
                event.stopPropagation();
                const category = button.dataset.catDelete;
                if (!category) return;
                try {
                    const verified = await promptReauthentication('删除分类', false, true);
                    if (!verified) return;
                } catch(e) { return; }
                const affected = State.passwords.filter(function(item) { return item.category === category; }).length;
                const userConfirmed = await promptForCategoryDeletion(category, affected);
                if (!userConfirmed) return;
                const oldPasswords = State.passwords.map(function(p) { return {...p}; });
                const oldCategories = [...State.customCategories];
                removeCategory(category);
                State.passwords.forEach(function(item) { if (item.category === category) item.category = ''; });
                State.rebuildIndex();
                try {
                    await saveEncrypted();
                } catch (error) {
                    State.passwords = oldPasswords;
                    State.customCategories = oldCategories;
                    State.rebuildIndex();
                    renderCategoryList(container);
                    renderListOnly();
                    refreshDatalist();
                    showToast('保存失败：' + error.message, true, 5000);
                    return;
                }
                renderListOnly();
                refreshDatalist();
                renderCategoryList(container);
                showToast(`已删除分类"${category}"`);
            });
        });

        const countElement = State.activeCategoryModal ? State.activeCategoryModal.querySelector('#catCount') : null;
        if (countElement) countElement.innerText = categories.length;
    }

    // ===================== 导出功能 =====================
    function escapeCsvField(field) {
        let str = String(field);
        return `"${str.replace(/"/g, '""')}"`;
    }

    async function exportCSV() {
        const confirmed = await showConfirmDialog({
            title: '导出CSV警告',
            message: '⚠️ CSV 导出为明文，会暴露所有密码。是否继续？',
            confirmText: '继续导出',
            cancelText: '取消',
            isDanger: true
        });
        if (!confirmed) return;
        try {
            await requireReauthentication('导出CSV', true);
        } catch(e) { return; }
        const headers = ['name', 'username', 'loginPassword', 'transactionPassword', 'category', 'email', 'phone', 'note'];
        const rows = State.passwords.map(function(item) { return headers.map(function(header) { return escapeCsvField(item[header] || ''); }).join(','); });
        const csvContent = '\uFEFF' + [headers.join(',')].concat(rows).join('\n');
        downloadBlob(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }), `静谧密钥_导出_${new Date().toISOString().slice(0,19)}.csv`);
        addLog('导出CSV', `${State.passwords.length}条`);
        showToast('📎 CSV已导出，请妥善保管');
    }

    async function exportEncryptedBackup() {
        try {
            await requireReauthentication('导出加密备份', true);
        } catch(e) { return; }
        const vaultData = { passwords: State.passwords, customCategories: State.customCategories };
        const exportData = await CryptoModule.encrypt(State.masterKey, vaultData);
        const exportObject = { version: 5, encrypted: true, salt: JSON.parse(localStorage.getItem(CONFIG.STORAGE_SALT)), data: exportData, plainChecksum: exportData.checksum };
        downloadBlob(new Blob([JSON.stringify(exportObject)], { type: 'application/json' }), `静谧密钥_加密备份_${new Date().toISOString().slice(0,19)}.json`);
        try {
            localStorage.setItem(CONFIG.LAST_EXPORT_KEY, String(Date.now()));
        } catch (error) {
            console.warn('记录上次导出时间失败:', error);
        }
        addLog('导出加密备份', '成功');
        showToast('🔒 加密备份已导出');
    }

    function downloadBlob(blob, filename) {
        try {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = filename;
            anchor.click();
            URL.revokeObjectURL(url);
        } catch (error) {
            console.error('下载文件失败:', error);
            showToast('下载失败，请重试或检查浏览器权限', true);
        }
    }

    // ===================== 导入功能 =====================
    async function importCSV(file, trustChecked) {
        if (!trustChecked) { showToast('请勾选信任来源', true); return; }
        try {
            await requireReauthentication('导入CSV', true);
        } catch(e) { return; }
        if (file.size > CONFIG.MAX_CSV_SIZE_MB * 1024 * 1024) { showToast(`文件不能超过${CONFIG.MAX_CSV_SIZE_MB}MB`, true); return; }
        const text = await file.text();
        const cleanText = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
        const lines = parseCSV(cleanText);
        if (lines.length < 2) { showToast('空文件或格式无效', true); return; }
        const headers = lines[0].map(function(header) { return header.trim().toLowerCase().replace(/^\uFEFF/, ''); });
        if (!headers.every(function(h) { return h; })) { showToast('CSV表头无效', true); return; }
        const columnIndex = {
            name: headers.findIndex(function(h) { return ['name','标题','title','名称','account'].includes(h); }),
            username: headers.findIndex(function(h) { return ['username','用户名','user','login'].includes(h); }),
            loginPassword: headers.findIndex(function(h) { return ['loginpassword','登录密码','password','密码','pass','pwd'].includes(h); }),
            transactionPassword: headers.findIndex(function(h) { return ['transactionpassword','交易密码','tranpassword','tran_pwd'].includes(h); }),
            email: headers.findIndex(function(h) { return ['email','邮箱','mail'].includes(h); }),
            phone: headers.findIndex(function(h) { return ['phone','手机','mobile','电话'].includes(h); }),
            category: headers.findIndex(function(h) { return ['category','分类','folder','类别'].includes(h); }),
            note: headers.findIndex(function(h) { return ['note','备注','notes','说明'].includes(h); })
        };
        if (columnIndex.name === -1 || columnIndex.loginPassword === -1) {
            const shouldContinue = await showConfirmDialog({
                title: 'CSV格式警告',
                message: 'CSV缺少"名称"或"登录密码"列，继续导入可能出错。是否尝试？',
                confirmText: '继续导入',
                cancelText: '取消',
                isDanger: false
            });
            if (!shouldContinue) return;
        }
        const importedRaw = [];
        for (let i = 1; i < lines.length; i++) {
            const row = lines[i];
            if (!row.length || (row.length === 1 && !row[0])) continue;
            const item = {
                name: (columnIndex.name >= 0 ? row[columnIndex.name] : '') ? String(row[columnIndex.name]).trim() : '',
                username: (columnIndex.username >= 0 ? row[columnIndex.username] : '') ? String(row[columnIndex.username]).trim() : '',
                loginPassword: (columnIndex.loginPassword >= 0 ? row[columnIndex.loginPassword] : '') ? String(row[columnIndex.loginPassword]).trim() : '',
                transactionPassword: (columnIndex.transactionPassword >= 0 ? row[columnIndex.transactionPassword] : '') ? String(row[columnIndex.transactionPassword]).trim() : '',
                email: (columnIndex.email >= 0 ? row[columnIndex.email] : '') ? String(row[columnIndex.email]).trim() : '',
                phone: (columnIndex.phone >= 0 ? row[columnIndex.phone] : '') ? String(row[columnIndex.phone]).trim() : '',
                category: (columnIndex.category >= 0 ? row[columnIndex.category] : '') ? String(row[columnIndex.category]).trim() : '',
                note: (columnIndex.note >= 0 ? row[columnIndex.note] : '') ? String(row[columnIndex.note]).trim() : ''
            };
            if (item.name && item.loginPassword) importedRaw.push(item);
        }
        if (!importedRaw.length) { showToast('无有效密码数据', true); return; }
        const baseTime = Date.now();
        const normalizedItems = importedRaw.map(function(i, index) {
            const normalized = normalizeItem(i);
            normalized.createdAt = normalized.createdAt || (baseTime + index);
            return normalized;
        });
        try {
            await applyImport(normalizedItems, [], false, false);
            syncCategoriesFromPasswords();
            showToast('CSV导入完成');
            addLog('导入CSV', `${normalizedItems.length}条`);
        } catch (error) {
            // applyImport 内部已处理回滚和提示
        }
    }

    async function importFromFile(file, trustChecked) {
        if (file.size > CONFIG.MAX_CSV_SIZE_MB * 1024 * 1024) { showToast('文件过大', true); return; }
        const text = await file.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch (error) { showToast('无效JSON文件', true); return; }
        if (parsed && parsed.encrypted && parsed.salt && parsed.data) {
            const password = await promptPasswordModal('请输入备份文件的主密码');
            if (!password) return;
            try {
                const key = await CryptoModule.deriveKey(password, new Uint8Array(parsed.salt));
                let decrypted = await CryptoModule.decrypt(key, parsed.data);
                if (parsed.version >= 4 && parsed.plainChecksum) {
                    const calculatedChecksum = await CryptoModule.computeStringChecksum(JSON.stringify(decrypted));
                    if (calculatedChecksum !== parsed.plainChecksum) {
                        throw new Error('校验和不匹配，文件可能已损坏，已中止导入');
                    }
                }
                let importedPasswords = [], importedCategories = [];
                if (Array.isArray(decrypted)) {
                    importedPasswords = decrypted;
                } else {
                    importedPasswords = decrypted.passwords || [];
                    importedCategories = decrypted.customCategories || [];
                }
                if (importedPasswords.length > CONFIG.MAX_PASSWORDS) {
                    showToast(`导入文件包含 ${importedPasswords.length} 条密码，超过上限 ${CONFIG.MAX_PASSWORDS}，请分批导入或调整上限`, true, 5000);
                    return;
                }
                const baseTime = Date.now();
                importedPasswords = importedPasswords.map(function(item, index) {
                    const normalized = normalizeItem(item);
                    normalized.createdAt = normalized.createdAt || (baseTime + index);
                    return normalized;
                });
                let replaceCategories = false;
                if (importedCategories.length > 0) {
                    replaceCategories = await showConfirmDialog({
                        title: '导入分类',
                        message: '导入文件包含分类库，是否替换当前分类？',
                        confirmText: '替换',
                        cancelText: '保留当前',
                        isDanger: false
                    });
                }
                await applyImport(importedPasswords, importedCategories, replaceCategories, true);
            } catch (error) {
                showToast('导入失败：' + error.message, true);
            }
        } else if (trustChecked && parsed && parsed.passwords && Array.isArray(parsed.passwords)) {
            try {
                await requireReauthentication('导入明文JSON', true);
            } catch(e) { return; }
            if (parsed.passwords.length > CONFIG.MAX_PASSWORDS) {
                showToast(`导入文件包含 ${parsed.passwords.length} 条密码，超过上限 ${CONFIG.MAX_PASSWORDS}`, true, 5000);
                return;
            }
            const importedCategories = parsed.customCategories || [];
            let replaceCategories = false;
            if (importedCategories.length > 0) {
                replaceCategories = await showConfirmDialog({
                    title: '导入分类',
                    message: '导入文件包含分类库，是否替换？',
                    confirmText: '替换',
                    cancelText: '保留当前',
                    isDanger: false
                });
            }
            const baseTime = Date.now();
            let importedPasswords = parsed.passwords.map(function(item, index) {
                const normalized = normalizeItem(item);
                normalized.createdAt = normalized.createdAt || (baseTime + index);
                return normalized;
            });
            await applyImport(importedPasswords, importedCategories, replaceCategories, true);
        } else if (trustChecked && Array.isArray(parsed)) {
            try {
                await requireReauthentication('导入明文数组', true);
            } catch(e) { return; }
            if (!parsed.length) { showToast('文件无数据', true); return; }
            if (parsed.length > CONFIG.MAX_PASSWORDS) {
                showToast(`文件包含 ${parsed.length} 条密码，超过上限 ${CONFIG.MAX_PASSWORDS}`, true, 5000);
                return;
            }
            const preview = parsed.slice(0, 5).map(function(p) { return `${p.name || '?'} | ${p.loginPassword || p.password || '?'}`; }).join('\n');
            const shouldImport = await showConfirmDialog({
                title: '导入预览',
                message: `预览前5条：<br><pre style="font-size:0.8rem;overflow-x:auto;white-space:pre-wrap;">${Util.escapeHtml(preview)}</pre>是否导入？`,
                confirmText: '导入',
                cancelText: '取消',
                isDanger: false,
                allowHtml: true   // 显式允许 HTML，因为包含 <br> 和 <pre>
            });
            if (shouldImport) {
                const baseTime = Date.now();
                let normalizedItems = parsed.map(function(item, index) {
                    const normalized = normalizeItem(item);
                    normalized.createdAt = normalized.createdAt || (baseTime + index);
                    return normalized;
                });
                await applyImport(normalizedItems, [], false, true);
            }
        } else { showToast('格式不支持或未勾选"信任来源"', true); }
    }

    async function applyImport(importedPasswords, importedCategories, replaceCategories, allowOverwrite) {
        importedPasswords = importedPasswords.slice(0, CONFIG.MAX_PASSWORDS).filter(function(item) { return item && item.name && item.loginPassword; });
        if (!importedPasswords.length) { showToast('无有效密码数据', true); return; }
        let overwrite = false;
        if (allowOverwrite) {
            overwrite = await showConfirmDialog({
                title: '导入方式',
                message: '覆盖当前所有密码？<br>确定 = 覆盖，取消 = 合并（跳过重名）',
                confirmText: '覆盖',
                cancelText: '合并',
                isDanger: true,
                allowHtml: true
            });
        }
        const previousPasswords = State.passwords.map(function(p) { return {...p}; });
        const previousCategories = [...State.customCategories];
        let skippedCount = 0;
        let truncatedCount = 0;
        try {
            if (overwrite) {
                if (importedPasswords.length > CONFIG.MAX_PASSWORDS) { showToast(`超过上限${CONFIG.MAX_PASSWORDS}`, true); return; }
                State.passwords = importedPasswords;
                State.visibleLoginPasswords.clear();
                State.visibleTransactionPasswords.clear();
            } else {
                if (State.passwords.length + importedPasswords.length > CONFIG.MAX_PASSWORDS) {
                    const spaceRemaining = CONFIG.MAX_PASSWORDS - State.passwords.length;
                    const existingNames = new Set(State.passwords.map(function(p) { return p.name; }));
                    const newItems = importedPasswords.filter(function(item) { return !existingNames.has(item.name); });
                    const skipped = importedPasswords.filter(function(item) { return existingNames.has(item.name); });
                    const toAdd = newItems.slice(0, spaceRemaining);
                    skippedCount = skipped.length;
                    truncatedCount = newItems.length - toAdd.length;
                    State.passwords.push.apply(State.passwords, toAdd);
                } else {
                    const existingNames = new Set(State.passwords.map(function(p) { return p.name; }));
                    const skipped = importedPasswords.filter(function(item) { return existingNames.has(item.name); });
                    const newItems = importedPasswords.filter(function(item) { return !existingNames.has(item.name); });
                    skippedCount = skipped.length;
                    State.passwords.push.apply(State.passwords, newItems);
                }
            }
            if (replaceCategories) saveCategories(importedCategories.length ? [...importedCategories] : []);
            else if (importedCategories.length) batchAddCategories(importedCategories, false);
            syncCategoriesFromPasswords();
            State.rebuildIndex();
            await saveEncrypted();
            if (!State.masterKey) throw new Error('存储异常');
            renderListOnly();
            refreshDatalist();
            addLog('导入', `${importedPasswords.length}条`);
            if (skippedCount > 0 || truncatedCount > 0) {
                let messageParts = [`✅ 导入完成（添加${importedPasswords.length - skippedCount - truncatedCount}条`];
                if (skippedCount > 0) messageParts.push(`跳过${skippedCount}条重名`);
                if (truncatedCount > 0) messageParts.push(`截断${truncatedCount}条（超上限）`);
                messageParts.push('）');
                showToast(messageParts.join('，'));
            } else {
                showToast('✅ 导入完成');
            }
        } catch (error) {
            State.passwords = previousPasswords;
            State.customCategories = previousCategories;
            State.rebuildIndex();
            showToast('保存失败：' + error.message, true, 5000);
        }
    }

    function syncCategoriesFromPasswords() {
        const categoriesFromPasswords = new Set();
        State.passwords.forEach(function(item) { if (item.category) categoriesFromPasswords.add(item.category); });
        const currentSet = new Set(loadCategories());
        const newCategories = [...categoriesFromPasswords].filter(function(c) { return !currentSet.has(c); });
        if (newCategories.length) batchAddCategories(newCategories, false);
        refreshDatalist();
    }

    async function changeMasterPassword(oldPassword, newPassword) {
        if (oldPassword === newPassword) throw new Error('新旧密码不能相同');
        const oldSaltArray = JSON.parse(localStorage.getItem(CONFIG.STORAGE_SALT));
        if (!oldSaltArray) throw new Error('未找到旧盐值');
        const oldSalt = new Uint8Array(oldSaltArray);
        const oldKey = await CryptoModule.deriveKey(oldPassword, oldSalt);
        const authOk = await CryptoModule.verifyAuth(oldKey, JSON.parse(localStorage.getItem(CONFIG.STORAGE_AUTH)));
        if (!authOk) throw new Error('旧密码验证失败');
        const vaultRaw = localStorage.getItem(CONFIG.STORAGE_VAULT);
        if (!vaultRaw) throw new Error('未找到保险库');
        let decrypted;
        try {
            decrypted = await CryptoModule.decrypt(oldKey, JSON.parse(vaultRaw));
        } catch (e) {
            throw new Error('保险库解密失败');
        }
        const oldData = Array.isArray(decrypted) ? { passwords: decrypted, customCategories: [] } : { passwords: decrypted.passwords || [], customCategories: decrypted.customCategories || [] };

        const oldBackup = {
            salt: oldSaltArray,
            auth: JSON.parse(localStorage.getItem(CONFIG.STORAGE_AUTH)),
            vault: JSON.parse(vaultRaw)
        };
        try {
            localStorage.setItem(CONFIG.MIGRATION_BACKUP_KEY, JSON.stringify(oldBackup));
        } catch (error) {
            console.warn('备份旧数据失败，继续修改主密码:', error);
        }
        const oldMasterKey = State.masterKey;

        try {
            const newSalt = crypto.getRandomValues(new Uint8Array(16));
            const newKey = await CryptoModule.deriveKey(newPassword, newSalt);
            const newAuth = await CryptoModule.createAuthVerifier(newKey);
            const newVaultData = { ...oldData, version: 3, lastUpdated: Date.now() };
            const newEncrypted = await CryptoModule.encrypt(newKey, newVaultData);

            await CryptoModule.decrypt(newKey, newEncrypted);

            localStorage.setItem(CONFIG.STORAGE_SALT, JSON.stringify(Array.from(newSalt)));
            localStorage.setItem(CONFIG.STORAGE_AUTH, JSON.stringify(newAuth));
            localStorage.setItem(CONFIG.STORAGE_VAULT, JSON.stringify(newEncrypted));

            State.masterKey = newKey;
            State.passwords = oldData.passwords;
            State.customCategories = oldData.customCategories;
            State.rebuildIndex();

            State.lastReauthenticationTime = 0;

            cleanMigrationBackup();
            oldPassword = '';
            addLog('修改主密码', '成功');

            if (State.channel) {
                try {
                    State.channel.postMessage({ type: 'masterPasswordChanged', timestamp: Date.now() });
                } catch (error) {
                    console.warn('BroadcastChannel 消息发送失败:', error);
                }
            }

            showToast('✅ 主密码修改成功');
        } catch (error) {
            State.masterKey = oldMasterKey;
            if (oldBackup) {
                localStorage.setItem(CONFIG.STORAGE_SALT, JSON.stringify(oldBackup.salt));
                localStorage.setItem(CONFIG.STORAGE_AUTH, JSON.stringify(oldBackup.auth));
                localStorage.setItem(CONFIG.STORAGE_VAULT, JSON.stringify(oldBackup.vault));
            }
            throw new Error('修改失败，已回滚: ' + error.message);
        }
    }

            } catch (error) {
                console.warn('日志导出读取失败:', error);

            downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `静谧密钥_日志_${new Date().toISOString().slice(0,19)}.json`);

            document.body.appendChild(modal);
            document.body.classList.add('modal-open');

            const cleanup = function(result) {

    // ===================== 主题管理 =====================
    function applyTheme(themeKey) {
        const theme = THEMES[themeKey];
        if (!theme) return;
        const root = document.documentElement;
        Object.entries(theme.vars).forEach(function(entry) {
            root.style.setProperty(entry[0], entry[1]);
        });
        State.currentTheme = themeKey;
        try {
            localStorage.setItem(CONFIG.THEME_STORAGE, themeKey);
        } catch (error) {
            console.warn('主题设置保存失败:', error);
        }
        const themeButton = document.getElementById('themeSwitcherBtn');
        if (themeButton) themeButton.innerHTML = `<svg class="icon"><use href="#icon-palette"/></svg> ${theme.icon}`;
        const dropdown = document.getElementById('themeDropdown');
        if (dropdown) dropdown.classList.remove('show');
        updateAllSelectColors();
    }

    function buildThemeDropdown() {
        const dropdown = document.getElementById('themeDropdown');
        if (!dropdown) return;
        dropdown.innerHTML = Object.entries(THEMES).map(function(entry) {
            const key = entry[0];
            const theme = entry[1];
            return `<div class="theme-option" data-theme="${key}">
                <div class="theme-color-preview" style="background: ${theme.vars['--primary']};"></div>
                <span>${theme.icon} ${theme.name}</span>
            </div>`;
        }).join('');
        dropdown.querySelectorAll('.theme-option').forEach(function(option) {
            option.addEventListener('click', function() { applyTheme(option.dataset.theme); });
        });
    }

    function debouncedSearch() {
        if (State.searchDebounceTimer) clearTimeout(State.searchDebounceTimer);
        State.searchDebounceTimer = setTimeout(function() {
            renderListOnly();
            State.lastActivity = Date.now();
        }, CONFIG.SEARCH_DEBOUNCE_MS);

    // ===================== 密码强度指示器 =====================
    function updateStrengthIndicator(indicatorId, textId, password) {
        const container = document.getElementById(indicatorId);
        if (!container) return;
        const level = Util.getPasswordStrength(password);
        const segments = container.querySelectorAll('.strength-segment');
        const textElement = document.getElementById(textId);
        const colors = ['#dc2626', '#f59e0b', '#f59e0b', '#059669', '#059669'];
        segments.forEach(function(segment, index) {
            if (index < level) {
                segment.style.background = colors[level] || '#dc2626';
            } else {
                segment.style.background = '#e2e8f0';
            }
        });
        if (textElement) {
            textElement.innerText = Util.strengthText(level);
            textElement.style.color = Util.strengthColor(level);
        }
    }

            const transactionPassword = document.getElementById('inpTranPw').value.trim();
            if (!name || !loginPassword) return showToast('名称和登录密码不能为空', true);
            if (loginPassword.length < CONFIG.LOGIN_PW_MIN || loginPassword.length > CONFIG.LOGIN_PW_MAX) return showToast(`登录密码需${CONFIG.LOGIN_PW_MIN}-${CONFIG.LOGIN_PW_MAX}位`, true);
            if (transactionPassword && !/^\d{6}$/.test(transactionPassword)) return showToast('交易密码必须为6位数字', true);
            if (State.passwords.length >= CONFIG.MAX_PASSWORDS) return showToast(`已达上限${CONFIG.MAX_PASSWORDS}`, true);

            const oldPasswords = State.passwords.map(function(p) { return {...p}; });

            const existingItem = State.passwords.find(function(p) { return p.name === name; });
            if (existingItem) {
                const resolution = await promptDuplicateNameResolution(name, true);
                if (resolution === 'cancel') return;
                if (resolution === 'overwrite') {
                    State.passwords = State.passwords.filter(function(p) { return p.id !== existingItem.id; });
                }
            }

            State.passwords.unshift(normalizeItem({
                name: name,
                username: document.getElementById('inpUsername').value.trim(),
                loginPassword: loginPassword,
                transactionPassword: transactionPassword,
                email: document.getElementById('inpEmail').value.trim(),
                phone: document.getElementById('inpPhone').value.trim(),
                category: document.getElementById('inpCategory').value || '',
                note: document.getElementById('inpNote').value.trim(),
                createdAt: Date.now()
            }));
            State.rebuildIndex();
            try {
                await saveEncrypted();
            } catch (error) {
                State.passwords = oldPasswords;
                State.rebuildIndex();
                showToast('保存失败：' + error.message, true, 5000);
                return;
            }
            renderListOnly();
            refreshDatalist();
            showToast(`✅ 已添加「${name}」`);

            State.addSectionVisible = false;
            addSection.style.display = 'none';
            if (addToggleChevron) addToggleChevron.style.transform = 'rotate(0deg)';
            const optionalFields = document.getElementById('optionalFields');
            if (optionalFields) optionalFields.classList.remove('show');
            const toggleOptionalBtn = document.getElementById('toggleOptional');
            if (toggleOptionalBtn) toggleOptionalBtn.textContent = '更多信息';
            ['inpName','inpUsername','inpLoginPw','inpTranPw','inpEmail','inpPhone','inpCategory','inpNote'].forEach(function(id) {
                const element = document.getElementById(id);
                if (element) element.value = '';
            });
            resetPasswordVisibilityButtons();
            updateAllSelectColors();
            State.lastActivity = Date.now();
        };

        document.getElementById('clearForm').onclick = function() {
            ['inpName','inpUsername','inpLoginPw','inpTranPw','inpEmail','inpPhone','inpCategory','inpNote'].forEach(function(id) {

        };

        document.getElementById('toggleOptional').onclick = function() {

        document.getElementById('toggleLoginPwVis').onclick = function() {

                if (input.type === 'password') {
                    input.type = 'text';
                    button.innerHTML = '<svg class="icon"><use href="#icon-eye-off"/></svg>';

                } else {
                    input.type = 'password';
                    button.innerHTML = '<svg class="icon"><use href="#icon-eye"/></svg>';
                    button.setAttribute('aria-label', '显示登录密码');
                }

            }
        };
        document.getElementById('toggleTranPwVis').onclick = function() {
            const input = document.getElementById('inpTranPw');

            if (input && button) {
                if (input.type === 'password') {
                    input.type = 'text';
