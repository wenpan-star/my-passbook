        document.getElementById('exportBtn').onclick = function() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:380px;text-align:center;">
                    <h3 style="margin-bottom:20px;"><svg class="icon" style="width:1.4rem;height:1.4rem;"><use href="#icon-download"/></svg> 选择导出格式</h3>
                    <button class="btn btn-primary" id="exportEncryptChoice" style="width:100%;margin-bottom:10px;">🔒 加密备份 (.json)</button>
                    <button class="btn btn-outline" id="exportPlainChoice" style="width:100%;margin-bottom:10px;">📄 明文JSON (.json)</button>
                    <button class="btn btn-outline" id="exportCsvChoice" style="width:100%;margin-bottom:10px;">📊 CSV 表格 (.csv)</button>
                    <button class="btn btn-outline btn-sm" id="cancelExport" style="margin-top:6px;">取消</button>
                </div>`;
            document.body.appendChild(modal);
            document.body.classList.add('modal-open');
            const previousFocus = document.activeElement;

            const closeModal = function() {
                modal.remove();
                document.body.classList.remove('modal-open');
                if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
            };
            modal.querySelector('#exportEncryptChoice').onclick = function() { closeModal(); exportEncryptedBackup(); };
            modal.querySelector('#exportPlainChoice').onclick = function() { closeModal(); exportPlaintextJSON(); };
            modal.querySelector('#exportCsvChoice').onclick = function() { closeModal(); exportCSV(); };
            modal.querySelector('#cancelExport').onclick = closeModal;
            modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
        };

        const exportMoreBtn = document.getElementById('exportMoreBtn');
        const exportDropdown = document.getElementById('exportDropdown');
        if (exportMoreBtn && exportDropdown) {
            exportMoreBtn.addEventListener('click', function(event) {
                event.stopPropagation();
                exportDropdown.classList.toggle('show');
            });
            const closeExportDropdown = function(event) {
                if (!exportMoreBtn.contains(event.target) && !exportDropdown.contains(event.target)) {
                    exportDropdown.classList.remove('show');
                }
            };
            document.addEventListener('click', closeExportDropdown, { signal });
        }

        const exportEncryptSmallBtn = document.getElementById('exportEncryptSmall');
        if (exportEncryptSmallBtn) exportEncryptSmallBtn.addEventListener('click', function() { exportDropdown.classList.remove('show'); exportEncryptedBackup(); });
        const exportPlainSmallBtn = document.getElementById('exportPlainSmall');
        if (exportPlainSmallBtn) exportPlainSmallBtn.addEventListener('click', function() { exportDropdown.classList.remove('show'); exportPlaintextJSON(); });
        const exportCsvSmallBtn = document.getElementById('exportCsvSmall');
        if (exportCsvSmallBtn) exportCsvSmallBtn.addEventListener('click', function() { exportDropdown.classList.remove('show'); exportCSV(); });
        const importSmallBtn = document.getElementById('importSmall');
        if (importSmallBtn) importSmallBtn.addEventListener('click', function() {
            exportDropdown.classList.remove('show');
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3><svg class="icon" style="width:1.4rem;height:1.4rem;"><use href="#icon-upload"/></svg> 导入选项</h3>
                    <div class="warning-box">⚠️ 导入明文JSON/CSV会暴露所有密码，请务必确认来源绝对可信。</div>
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;font-size:0.9rem;">
                        <input type="checkbox" id="trustPlainCheckSmall" class="checkbox-sm"> 我信任此来源，允许导入明文文件
                    </label>
                    <div class="button-group" style="display:flex; gap:10px; margin-top:12px;">
                        <button id="cancelImportSmallBtn" class="btn btn-outline" style="flex:1;">取消</button>
                        <button id="importFileBtnSmall" class="btn btn-primary" style="flex:2;">选择文件</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            document.body.classList.add('modal-open');
            const previousFocus = document.activeElement;
            const closeImportSmallModal = function() {
                modal.remove();
                document.body.classList.remove('modal-open');
                if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
            };
            modal.querySelector('#cancelImportSmallBtn').onclick = closeImportSmallModal;
            modal.addEventListener('click', function(e) { if (e.target === modal) closeImportSmallModal(); });
            modal.querySelector('#importFileBtnSmall').onclick = function() {
                const trustChecked = modal.querySelector('#trustPlainCheckSmall').checked;
                closeImportSmallModal();
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.json,.csv';
                fileInput.onchange = async function(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    if (file.name.endsWith('.csv')) await importCSV(file, trustChecked);
                    else await importFromFile(file, trustChecked);
                    fileInput.remove();
                };
                fileInput.click();
            };
        });

        document.getElementById('batchBtn').onclick = toggleBatchMode;
        document.getElementById('cancelBatchBtn').onclick = toggleBatchMode;
        document.getElementById('batchDeleteBtn').onclick = batchDelete;
        document.getElementById('batchMoveBtn').onclick = function() {
            const category = document.getElementById('batchCategorySelect').value;
            if (category) batchMoveCategory(category);
        };

        document.getElementById('lockBtn').onclick = function() { lockAndLogout(); showToast('🔒 已手动锁定'); };
        document.getElementById('changeMasterPwBtn').onclick = showChangePasswordModal;
        document.getElementById('categoryManagerBtn').onclick = openCategoryManager;
        document.getElementById('logBtn').onclick = showLogs;
        document.getElementById('wipeBtn').onclick = wipeAllPasswords;

        document.getElementById('importBtn').onclick = function() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3><svg class="icon" style="width:1.4rem;height:1.4rem;"><use href="#icon-upload"/></svg> 导入选项</h3>
                    <div class="warning-box">⚠️ 导入明文JSON/CSV会暴露所有密码，请务必确认来源绝对可信。</div>
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;font-size:0.9rem;">
                        <input type="checkbox" id="trustPlainCheck" class="checkbox-sm"> 我信任此来源，允许导入明文文件
                    </label>
                    <div class="button-group" style="display:flex; gap:10px; margin-top:12px;">
                        <button id="cancelImportBtn" class="btn btn-outline" style="flex:1;">取消</button>
                        <button id="importFileBtn" class="btn btn-primary" style="flex:2;">选择文件</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            document.body.classList.add('modal-open');
            const previousFocus = document.activeElement;
            const closeImportModal = function() {
                modal.remove();
                document.body.classList.remove('modal-open');
                if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
            };
            modal.querySelector('#cancelImportBtn').onclick = closeImportModal;
            modal.addEventListener('click', function(e) { if (e.target === modal) closeImportModal(); });
            modal.querySelector('#importFileBtn').onclick = function() {
                const trustChecked = modal.querySelector('#trustPlainCheck').checked;
                closeImportModal();
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.json,.csv';
                fileInput.onchange = async function(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    if (file.name.endsWith('.csv')) await importCSV(file, trustChecked);
                    else await importFromFile(file, trustChecked);
                    fileInput.remove();
                };
                fileInput.click();
            };
        };

        const themeSwitcherBtn = document.getElementById('themeSwitcherBtn');
        const themeDropdown = document.getElementById('themeDropdown');
        if (themeSwitcherBtn && themeDropdown) {
            themeSwitcherBtn.addEventListener('click', function(event) {
                event.stopPropagation();
                themeDropdown.classList.toggle('show');
            });
            const closeThemeDropdown = function(event) {
                if (!themeSwitcherBtn.contains(event.target) && !themeDropdown.contains(event.target)) {
                    themeDropdown.classList.remove('show');
                }
            };
            document.addEventListener('click', closeThemeDropdown, { signal });
        }

        updateAllSelectColors();
        State.lastActivity = Date.now();
    };

    // ===================== 认证界面 =====================
    let showAuth = function() {
        const root = document.getElementById('root');
        if (!root) return;
        cleanMigrationBackup();
        const initialized = localStorage.getItem(CONFIG.STORAGE_INIT) === 'true' &&
            localStorage.getItem(CONFIG.STORAGE_SALT) &&
            localStorage.getItem(CONFIG.STORAGE_AUTH) &&
            localStorage.getItem(CONFIG.STORAGE_VAULT);
        if (!initialized) {
            root.innerHTML = `
                <div class="card auth-card">
                    <div class="auth-icon"><svg viewBox="0 0 24 24" style="width:4rem;height:4rem;fill:none;stroke:currentColor;stroke-width:1.8;"><use href="#icon-shield"/></svg></div>
                    <h2>静谧·密钥</h2>
                    <p style="font-size:0.95rem;">专业的本地密码管理器</p>
                    <p style="font-size:0.85rem;color:var(--text-secondary);">首次使用，请设置一个强主密码来保护您的数据</p>
                    <button class="btn btn-primary" id="setupBtn" style="width:100%;">设置主密码</button>
                </div>`;
            document.getElementById('setupBtn').onclick = function() {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-card">
                        <h3><svg class="icon" style="width:1.4rem;height:1.4rem;"><use href="#icon-lock"/></svg> 设置主密码</h3>
                        <div class="warning-box">⚠️ 主密码需至少${CONFIG.MASTER_MIN_LEN}位，且包含大写、小写、数字、特殊符号四类。请务必牢记！</div>
                        <input type="password" id="newPw1" placeholder="至少${CONFIG.MASTER_MIN_LEN}位，含四类字符" autocomplete="new-password" autocapitalize="none" autofocus>
                        <div class="strength-indicator" id="setupPwStrengthIndicator">
                            <div class="strength-segment" data-index="0"></div>
                            <div class="strength-segment" data-index="1"></div>
                            <div class="strength-segment" data-index="2"></div>
                            <div class="strength-segment" data-index="3"></div>
                        </div>
                        <div class="strength-text" id="setupPwStrengthText">请输入主密码</div>
                        <input type="password" id="newPw2" placeholder="确认主密码" autocomplete="new-password" autocapitalize="none" style="margin-top:8px;">
                        <div class="button-group" style="display:flex; gap:10px; margin-top:12px;">
                            <button id="cancelSetup" class="btn btn-outline" style="flex:1;">取消</button>
                            <button id="confirmSetup" class="btn btn-primary" style="flex:2;">创建保险库</button>
                        </div>
                    </div>`;
                document.body.appendChild(modal);
                document.body.classList.add('modal-open');
                const previousFocus = document.activeElement;
                const passwordInput1 = modal.querySelector('#newPw1');
                passwordInput1.addEventListener('input', function() {
                    updateStrengthIndicator('setupPwStrengthIndicator', 'setupPwStrengthText', passwordInput1.value);
                });
                const closeSetupModal = function() {
                    passwordInput1.value = '';
                    modal.querySelector('#newPw2').value = '';
                    modal.remove();
                    document.body.classList.remove('modal-open');
                    if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
                };
                modal.querySelector('#cancelSetup').onclick = closeSetupModal;
                modal.querySelector('#confirmSetup').onclick = async function() {
                    const password1 = passwordInput1.value;
                    const password2 = modal.querySelector('#newPw2').value;
                    if (!Util.isStrongMasterPassword(password1)) return showToast('密码强度不足，需至少' + CONFIG.MASTER_MIN_LEN + '位含四类字符', true);
                    if (password1 !== password2) return showToast('两次输入不一致', true);
                    try {
                        await initializeNewVault(password1);
                        closeSetupModal();
                        showToast('✅ 保险库创建成功！');
                        showAuth();
                    } catch (error) { showToast(error.message, true); }
                };
                modal.addEventListener('click', function(e) { if (e.target === modal) closeSetupModal(); });
            };
        } else {
            root.innerHTML = `
                <div class="card auth-card">
                    <div class="auth-icon"><svg viewBox="0 0 24 24" style="width:4rem;height:4rem;fill:none;stroke:currentColor;stroke-width:1.8;"><use href="#icon-lock"/></svg></div>
                    <h2>静谧·密钥</h2>
                    <p>请输入主密码以解锁</p>
                    <input type="password" id="loginPw" placeholder="主密码" autocomplete="current-password" autocapitalize="none" autofocus>
                    <div id="errorMsg" style="color:var(--danger);font-size:0.85rem;min-height:20px;margin:4px 0;"></div>
                    <button class="btn btn-primary" id="loginBtn" style="width:100%;"><svg class="icon"><use href="#icon-unlock"/></svg> 验证进入</button>
                    <p style="font-size:0.72rem;color:var(--text-secondary);margin-top:12px;">🔒 数据完全存储在本地浏览器，不会上传至任何服务器</p>
                </div>`;
            const loginPasswordInput = document.getElementById('loginPw');
            const errorDiv = document.getElementById('errorMsg');
            const loginButton = document.getElementById('loginBtn');
            const doLogin = async function() {
                try {
                    await unlockVault(loginPasswordInput.value);
                    renderApp();
                } catch (error) {
                    errorDiv.innerText = error.message;
                    loginPasswordInput.value = '';
                    loginPasswordInput.focus();
                    if ((error.message.includes('数据损坏') || error.message.includes('解密失败') || error.message.includes('数据缺失')) && !document.getElementById('resetVaultBtn')) {
                        const resetBtn = document.createElement('button');
                        resetBtn.id = 'resetVaultBtn';
                        resetBtn.className = 'btn btn-danger btn-sm';
                        resetBtn.style.marginTop = '8px';
                        resetBtn.style.width = '100%';
                        resetBtn.innerText = '⚠️ 数据异常？重置保险库';
                        resetBtn.onclick = async function() {
                            const confirmed = await showConfirmDialog({
                                title: '重置保险库',
                                message: '⚠️ 确定重置保险库吗？此操作将清除所有密码和设置，且不可恢复！',
                                confirmText: '重置',
                                cancelText: '取消',
                                isDanger: true,
                                requireConfirmationText: '重置'
                            });
                            if (confirmed) {
                                try {
                                    localStorage.removeItem(CONFIG.STORAGE_VAULT);
                                    localStorage.removeItem(CONFIG.STORAGE_SALT);
                                    localStorage.removeItem(CONFIG.STORAGE_AUTH);
                                    localStorage.removeItem(CONFIG.STORAGE_INIT);
                                    localStorage.removeItem(CONFIG.LOG_STORAGE);
                                    localStorage.removeItem(CONFIG.MIGRATION_BACKUP_KEY);
                                    saveSecurityState({ bruteFailCount: 0, lockoutUntil: 0 });
                                    State.reset();
                                    showToast('保险库已重置，请重新设置主密码');
                                    showAuth();
                                } catch (error) {
                                    showToast('重置失败：' + error.message, true);
                                }
                            }
                        };
                        errorDiv.after(resetBtn);
                    }
                }
            };
            loginButton.onclick = async function() {
                loginButton.disabled = true;
                try { await doLogin(); } finally { loginButton.disabled = false; }
            };
            loginPasswordInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' && !loginButton.disabled) doLogin();
            });
            loginPasswordInput.focus();
        }
    };

    // ===================== 空闲与可见性事件绑定 =====================
    function bindIdleEvents() {
        ['click', 'keydown', 'touchstart', 'scroll'].forEach(function(eventName) {
            window.addEventListener(eventName, function() { State.lastActivity = Date.now(); }, { passive: true });
        });
    }

    // ===================== 启动（含存储可用性检查） =====================
    function isStorageAvailable() {
        try {
            const testKey = '__serene_storage_test__';
            localStorage.setItem(testKey, '1');
            localStorage.removeItem(testKey);
            return true;
        } catch (e) {
            return false;
        }
    }

    if (typeof crypto !== 'undefined' && crypto.subtle && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        if (!isStorageAvailable()) {
            document.getElementById('root').innerHTML = `<div class="card auth-card"><h2>⚠️ 存储不可用</h2><p>您的浏览器似乎禁用了本地存储（localStorage），静谧·密钥无法正常运行。</p><p style="color:var(--text-secondary);">请检查隐私设置或更换浏览器后重试。</p></div>`;
        } else {
            bindIdleEvents();
            const savedTheme = localStorage.getItem(CONFIG.THEME_STORAGE);
            applyTheme(savedTheme && THEMES[savedTheme] ? savedTheme : 'ocean');
            showAuth();
        }
    } else {
        document.getElementById('root').innerHTML = `<div class="card auth-card"><h2>⚠️ 环境不安全</h2><p>Web Crypto API 需要 HTTPS 或 localhost 环境才能正常工作。</p><p style="color:var(--text-secondary);">当前协议：${location.protocol}</p></div>`;
    }
})();
</script>
</body>
</html>
